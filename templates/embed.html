{% extends "base.html" %}

{% block title %}
Embed Secret Message
{% endblock %}

{% block content %}

<div class="card shadow-lg">

    <div class="card-header bg-primary text-white">

        <h2 class="text-center">

            🔒 Secure Message Embedding

        </h2>

    </div>

    <div class="card-body">

        <form action="/embed" method="POST" enctype="multipart/form-data">

            <!-- Upload -->

            <!-- Upload Area -->

<div class="mb-4">

    <label class="form-label">

        Cover Image

    </label>

    <div id="drop-area" class="upload-box">

        <i class="bi bi-cloud-arrow-up-fill display-1 text-primary"></i>

        <h4 class="mt-3">

            Drag & Drop Image Here

        </h4>

        <p class="text-muted">

            or

        </p>

        <button
            type="button"
            class="btn btn-primary"
            onclick="document.getElementById('image').click();">

            Choose Image

        </button>

        <input
            type="file"
            id="image"
            name="image"
            accept=".png,.jpg,.jpeg,.bmp"
            hidden
            onchange="previewImage(event)"
            required>

        <p class="mt-3 text-success" id="file-name">

            No image selected

        </p>

    </div>

</div>

            <!-- Preview -->

            <div class="text-center">

                <img
                    id="preview"
                    class="preview-image"
                    style="display:none;">

            </div>

            <hr>

            <!-- Message -->

            <div class="mb-3">

                <label class="form-label">

                    Secret Message

                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    class="form-control"
                    placeholder="Enter your secret message..."
                    onkeyup="countCharacters()"
                    required></textarea>

                <small>

                    Characters :
                    <span id="charCount">0</span>

                </small>

            </div>

            <!-- Password -->

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        required>

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword()">

                        👁

                    </button>

                </div>

            </div>

            <div class="text-center">

                <button
                    class="btn btn-success btn-lg">

                    Encrypt & Embed

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
